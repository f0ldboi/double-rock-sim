<pre id="test-out">running</pre>
<script>
window.__errs = [];
window.addEventListener('error', e => window.__errs.push('ERROR ' + e.message + ' @' + e.lineno));
window.addEventListener('load', () => setTimeout(() => {
  const out = [];
  const ok = (c, m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
  try {
    const D = window.__drs;
    const run = n => { for (let i = 0; i < n; i++) { D.G.stepping = true; D.doTick(performance.now()); D.G.stepping = false; } };
    const r = () => D.G.tick - D.G.rep.start;
    const k = (x, y) => x + ',' + y;

    // A: stand still with Magic on before the throw
    D.S = Object.assign({}, D.S, { color: 'mage', std: false, mode: 'dodge', death: false, debris: 18 });
    D.newGame(true);
    const hitBy0 = { ...D.ST.hitBy }, logEl = document.getElementById('log'), logMark = logEl.firstElementChild;
    D.queueInput({ type: 'pray', style: 'mage' });
    run(1);
    ok(D.G.player.prayer === 'mage', 'A prayer applies on the next tick');
    run(5);
    ok(D.G.rep && D.G.rep.start === 6, 'A rep starts on tick 6');
    const repA = D.G.rep;
    ok(D.G.rocks.length === 1, 'A rock 1 in the air at T+0');
    run(3); ok(D.G.rocks.length === 2, 'A rock 2 thrown at T+3');
    run(4); ok(r() === 7, 'A at T+7');
    ok(D.G.player.prayer === null, 'A burst 1 switches prayer off');
    ok(D.G.pendingBoulders.length === 1 && D.G.pendingBoulders[0].x === 17 && D.G.pendingBoulders[0].y === 6, 'A boulder 1 locked on the standing tile');
    ok(D.G.shadows.length === 1 && D.G.shadows[0].land === D.G.tick + 2, 'A shadows land 2 ticks after burst');
    const hp0 = D.G.player.hp;
    run(1); ok(D.G.boulders.size === 0, 'A nothing landed at T+8');
    run(1); ok(r() === 9 && D.G.boulders.has('17,6'), 'A boulder 1 lands at T+9');
    ok(D.G.player.hp < hp0 && !(D.G.player.x === 17 && D.G.player.y === 6), 'A boulder hit and shoved the player');
    ok(Math.max(Math.abs(D.G.player.x - 17), Math.abs(D.G.player.y - 6)) === 1, 'A shove stays inside the 3x3');
    const shoved = [D.G.player.x, D.G.player.y];
    run(1); ok(r() === 10, 'A at T+10');
    const s1 = D.G.rep.shadow1, s2 = D.G.shadows.find(s => s.id === 2);
    ok(!!s2 && [...s2.tiles].every(t => !s1.has(t)), 'A rock 2 debris never shares a rock 1 tile');
    ok(D.G.rep.b2.x === shoved[0] && D.G.rep.b2.y === shoved[1], 'A boulder 2 locked where the shove left you (stunned)');
    ok(D.G.projs.filter(p => p.kind === 'rock').map(p => p.hit - D.G.rep.start).join() === '11,12,13,14,15,16', 'A barrage lands T+11..T+16');
    ok(D.G.rep.pattern.join() === 'mage,range,mage,mage,range,mage', 'A blue pattern M R M M R M');
    run(6);
    ok(D.G.rep === null, 'A rep finished after T+16');
    // T: the session counts how many times each kind of damage hit you
    const gotH = k => D.ST.hitBy[k] - hitBy0[k];
    const wantH = { debris: [repA.d1, repA.d2].filter(Boolean).length, boulder: [repA.b1, repA.b2].filter(b => b && b.hit).length, barrage: repA.hits.filter(h => h && !h.ok).length };
    ok(['debris', 'boulder', 'barrage'].every(k => gotH(k) === wantH[k]) && wantH.boulder === 2 && wantH.barrage === 6, 'T hits counted by type: ' + JSON.stringify(wantH));
    ok(['debris', 'boulder', 'barrage'].every(k => document.getElementById('st-n-' + k).textContent === String(D.ST.hitBy[k])), 'T the Times hit column shows the counts');
    const repLog = [];
    for (let li = logEl.firstElementChild; li && li !== logMark; li = li.nextElementSibling) repLog.push(li.textContent);
    ok(repLog.filter(t => t.includes('would have killed you')).length === 1, 'N Practice hitpoints keep you alive and the log says so once per rep');
    ok(document.querySelector('#report').textContent.includes('Rep 1'), 'A report rendered');
    ok(document.querySelectorAll('#report .bchip.bad').length === 6, 'A all six barrage hits missed with no prayer');
    ok(document.querySelectorAll('#report .bchip.bad .hs:not(.zero)').length === 6, 'P barrage damage shows as red hitsplats in the report');
    ok(!!document.querySelector('#report .rep-head .hs') && !document.querySelector('#report .rep-head .pill'), 'P the rep total is a hitsplat: ' + document.querySelector('#report .rep-head').textContent);
    ok([...document.querySelectorAll('#log li.bad')].filter(li => li.querySelector('.hs')).length >= 7, 'P damage in the tick log shows as hitsplats: ' + [...document.querySelectorAll('#log li.bad')].slice(0, 2).map(li => li.textContent).join(' | '));
    ok(D.G.chat.length > 0 && D.G.chat.every(m => !m.msg.includes('\uE000')), 'P the in-game chat keeps plain numbers: ' + D.G.chat[D.G.chat.length - 2].msg);

    // B: scripted perfect run, green rocks
    D.S = Object.assign({}, D.S, { color: 'range' });
    D.newGame(true);
    run(6); ok(D.G.rep && r() === 0, 'B rep started');
    run(6); ok(r() === 6, 'B at T+6 (dip 1)');
    D.queueInput({ type: 'move', x: 22, y: 1 });
    run(1); ok(r() === 7, 'B at T+7');
    ok(D.G.rep.b1.x === 17 && D.G.rep.b1.y === 6, 'B dip exit: boulder 1 lands where you stood');
    ok(D.G.player.x === 19 && D.G.player.y === 4, 'B moved 2 tiles on the burst tick');
    const sh1 = D.G.rep.shadow1;
    const P = D.G.player;
    let best = null;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const x = P.x + dx, y = P.y + dy;
      if (x < 0 || y < 0 || x > 24 || y > 24 || sh1.has(k(x, y)) || (x === 17 && y === 6)) continue;
      let adj = 0; for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if ((a || b) && sh1.has(k(x + a, y + b))) adj++;
      if (adj && (!best || adj > best.adj)) best = { x, y, adj };
    }
    ok(!!best, 'B found a safe tile next to rock 1 debris');
    D.queueInput({ type: 'move', x: best.x, y: best.y });
    run(1); run(1);
    ok(r() === 9 && D.G.rep.d1 === 0 && D.G.rep.b1.hit === 0, 'B clear of debris 1 and boulder 1 at T+9');
    run(1); ok(r() === 10 && D.G.player.prayer === null, 'B burst 2 at T+10');
    const p2 = D.G.player;
    let onto = null;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if ((dx || dy) && sh1.has(k(p2.x + dx, p2.y + dy)) && !D.G.boulders.has(k(p2.x + dx, p2.y + dy))) onto = onto || [p2.x + dx, p2.y + dy];
    ok(!!onto, 'B a rock 1 tile is one step away');
    D.queueInput({ type: 'pray', style: D.G.rep.pattern[0] });
    if (onto) D.queueInput({ type: 'move', x: onto[0], y: onto[1] });
    for (let i = 0; i < 6; i++) {
      run(1);
      const nxt = D.G.rep && D.G.rep.pattern[i + 1];
      if (nxt && nxt !== D.G.player.prayer) D.queueInput({ type: 'pray', style: nxt });
    }
    ok(D.G.rep === null, 'B rep finished');
    ok(document.querySelector('#report .pill').textContent === 'Clean', 'B scripted perfect run is clean');
    ok(document.querySelectorAll('#report .bchip.ok').length === 6, 'B all six barrage hits blocked');
    ok(document.querySelectorAll('#report .bchip .hs.zero').length === 6, 'P blocked hits show blue zero hitsplats');

    // C: praying between the bursts gets wiped
    D.newGame(true);
    run(6 + 8);
    ok(r() === 8, 'C at T+8');
    D.queueInput({ type: 'pray', style: 'range' });
    run(1); ok(D.G.player.prayer === 'range', 'C prayer on at T+9');
    run(1); ok(D.G.player.prayer === null && D.G.rep.wipedEarly, 'C burst 2 wipes the early prayer');

    // D: pathing goes around Doom and never cuts its corner
    D.newGame(true);
    const path = D.findPath(8, 12, 16, 12);
    ok(path.length >= 8 && path.every(([x, y]) => !(x >= 10 && x < 15 && y >= 10 && y < 15)), 'D path avoids Doom (' + path.length + ' steps)');
    ok(D.findPath(17, 6, 22, 1).length === 5, 'D open-field diagonal is 5 steps');

    // E: 60 reps with a random walker, check invariants
    D.S = Object.assign({}, D.S, { color: 'random' });
    D.newGame(true);
    let reps = 0, overlap = 0, wrongLock = 0, last = null;
    for (let i = 0; i < 60 * 30 && reps < 60; i++) {
      if (Math.random() < 0.35) D.queueInput({ type: 'move', x: Math.floor(Math.random() * 25), y: Math.floor(Math.random() * 25) });
      const before = D.G.rep ? [D.G.player.x, D.G.player.y, r()] : null;
      run(1);
      const rep = D.G.rep;
      if (rep && before && (before[2] + 1 === 7 || before[2] + 1 === 10)) {
        const id = before[2] + 1 === 7 ? 1 : 2, b = rep['b' + id];
        if (!b || b.x !== before[0] || b.y !== before[1]) wrongLock++;
        if (id === 2) { const s2b = D.G.shadows.find(s => s.id === 2); if (s2b && [...s2b.tiles].some(t => rep.shadow1.has(t))) overlap++; }
      }
      if (last && !rep) reps++;
      last = rep;
    }
    ok(reps >= 50, 'E completed ' + reps + ' reps');
    ok(overlap === 0, 'E no rock 2 debris on rock 1 tiles');
    ok(wrongLock === 0, 'E boulder always locks the tile you held at the start of the burst tick');
    ok(D.G.projs.every(p => p.kind === 'rock'), 'E only barrage projectiles exist (no autos)');

    // F: camera keeps Doom's body and your surroundings in the open view from every tile
    D.S = Object.assign({}, D.S, { camera: 'frame', zoom: 12, std: false });
    D.newGame(true);
    D.layout();
    const V = D.V, DV = D.DOOM_VIEW, YV = D.YOU_VIEW;
    const inView = (x0, y0, x1, y1) => D.sx(x0) >= V.rx0 - 0.5 && D.sx(x1) <= V.rx1 + 0.5 && D.sy(y0) >= V.ry0 - 0.5 && D.sy(y1) <= V.ry1 + 0.5;
    const bd = (x, y) => Math.max(x < 10 ? 10 - x : x > 14 ? x - 14 : 0, y < 10 ? 10 - y : y > 14 ? y - 14 : 0);
    const snap = (x, y) => { D.cam.init = false; D.updateCam([x, y], 16); return V.ch / V.TS; };
    let lostDoom = 0, lostYou = 0, worstZ = 0, nearWorst = 0;
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      if (bd(x, y) === 0) continue;
      const Z = snap(x, y);
      if (!inView(DV.x0, DV.y0, DV.x1, DV.y1)) lostDoom++;
      if (!inView(Math.max(x + 0.5 - YV.side, -0.5), y + 0.5 - YV.up, Math.min(x + 0.5 + YV.side, 25.5), Math.min(y + 0.5 + YV.down, 25.5))) lostYou++;
      worstZ = Math.max(worstZ, Z);
      if (bd(x, y) <= 4) nearWorst = Math.max(nearWorst, Z);
    }
    ok(lostDoom === 0, 'F Doom stays in the open view from every tile (' + lostDoom + ' misses)');
    ok(lostYou === 0, 'F your surroundings stay in the open view (' + lostYou + ' misses)');
    const zStart = snap(17, 6), zEast = snap(17, 12), zWest = snap(7, 12), zSouth = snap(12, 17), zNorth = snap(12, 7);
    ok(zEast <= 12.01 && zWest <= 12.01 && zSouth <= 12.01, 'F full zoom beside and below Doom (E ' + zEast.toFixed(2) + ' W ' + zWest.toFixed(2) + ' S ' + zSouth.toFixed(2) + ' tiles tall)');
    ok(zStart < 13 && zNorth < 13, 'F still closer than the old 14 tiles north of Doom (start ' + zStart.toFixed(2) + ', N ' + zNorth.toFixed(2) + ')');
    out.push('INFO zoom within 4 tiles of Doom at most ' + nearWorst.toFixed(2) + ' tiles tall, anywhere at most ' + worstZ.toFixed(2));
    D.S = Object.assign({}, D.S, { camera: 'follow' });
    const zFollow = snap(2, 2);
    ok(Math.abs(zFollow - 12) < 0.01, 'F centred camera keeps the zoom setting');
    D.S = Object.assign({}, D.S, { camera: 'frame' });

    // G: both rocks stay wholly on screen through the whole flight, without needing the edge clamp where players stand
    let clamped = 0, clampedNear = 0, samples = 0;
    const rk = (id, thrown) => ({ id, thrown, color: 'mage' });
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      if (bd(x, y) === 0) continue;
      snap(x, y);
      const r1 = rk(1, 0), r2 = rk(2, 3);
      for (let ct = 0; ct < 10; ct += 0.1) {
        D.G.rocks = [r1, r2].filter(k => ct >= k.thrown && ct < k.thrown + 7);
        for (const k of D.G.rocks) {
          const st = D.rockState(k, ct, [x, y], 50);
          const rad = 1.9 * st.sc * V.TS / 2, X = D.sx(st.x), Y = D.sy(st.y) - st.h * V.TS;
          const out_ = X - rad < V.rx0 - 0.5 || X + rad > V.rx1 + 0.5 || Y - rad < V.ry0 - 0.5 || Y + rad > V.ry1 + 0.5;
          samples++;
          if (out_) { clamped++; if (bd(x, y) <= 6 && y <= 14) clampedNear++; }
          const sc = D.rockScreen(st);
          if (sc.X - sc.d / 2 < V.rx0 - 0.5 || sc.X + sc.d / 2 > V.rx1 + 0.5 || sc.Y - sc.d / 2 < V.ry0 - 0.5 || sc.Y + sc.d / 2 > V.ry1 + 0.5) clamped += 1e6;
        }
      }
    }
    D.G.rocks = [];
    ok(clamped < 1e6, 'G rocks are always drawn wholly inside the open view');
    ok(clampedNear === 0, 'G north, east and west of Doom the rocks fit without the edge clamp (' + clampedNear + ')');
    out.push('INFO rock frames that needed the edge clamp anywhere: ' + clamped + ' of ' + samples);

    // S: the flight is one continuous throw: from the throw to the burst the rock never hangs in place. In any
    // one tick it travels a fair way along the path it is actually drawn on (after the edge clamp, counting
    // growth and shrinking at its edge too), where the old 3-tick hover only bobbed. The slowest spot is a lob
    // thrown straight away from the camera, standing against Doom's north side: it turns over at the top
    // like a thrown ball.
    const slowestFrom = spots => {
      let slow = 1e9, at = '';
      for (const [x, y] of spots) {
        snap(x, y);
        const kk = { id: 1, thrown: 0, color: 'mage' };
        D.G.rocks = [kk];
        const pts = [];
        for (let i = 0; i <= 140; i++) { const sc = D.rockScreen(D.rockState(kk, i * 0.05, [x, y], 50)); pts.push([sc.X / V.TS, sc.Y / V.TS, sc.d / 2 / V.TS]); }
        for (let i = 8; i + 20 <= 140; i++) {
          let len = 0;
          for (let j = i; j < i + 20; j++) len += Math.hypot(pts[j + 1][0] - pts[j][0], pts[j + 1][1] - pts[j][1], pts[j + 1][2] - pts[j][2]);
          if (len < slow) { slow = len; at = 'tile ' + x + ',' + y + ', age ' + (i * 0.05).toFixed(2) + '-' + (i * 0.05 + 1).toFixed(2); }
        }
      }
      D.G.rocks = [];
      return [slow, at];
    };
    const [slowest, slowAt] = slowestFrom([[17, 6], [12, 7], [12, 9], [7, 12], [9, 12], [17, 12], [12, 15], [12, 16], [12, 17], [15, 15], [9, 16], [20, 2], [4, 6], [12, 6]]);
    ok(slowest >= 0.12, 'S rocks keep moving: the slowest tick still covers ' + slowest.toFixed(2) + ' tiles (' + slowAt + ')');
    const [slowFar, slowFarAt] = slowestFrom([[12, 19], [12, 21], [12, 23], [8, 20], [17, 21], [4, 20], [21, 22]]);
    out.push('INFO far south of Doom, where the view ends close above Doom, the slowest tick covers ' + slowFar.toFixed(2) + ' tiles (' + slowFarAt + ')');
    const kEnd = { id: 1, thrown: 0, color: 'mage' };
    snap(17, 6);
    D.G.rocks = [kEnd];
    const atBurst = D.rockState(kEnd, 7, [17, 6]), atDip = D.rockState(kEnd, 6, [17, 6]);
    D.G.rocks = [];
    ok(Math.abs(atBurst.x - 17.5) < 0.01 && Math.abs(atBurst.y - 6.5) < 0.01 && Math.abs(atBurst.h - 2.2) < 0.01 && atDip.dip === 0 && atBurst.h < atDip.h - 0.5, 'S the dip starts at age 6 and the rock comes down to burst over you');

    // and its speed only ever changes smoothly. Frame by frame at 60 fps, with the camera following, the
    // speed it is drawn moving at never jumps from one frame to the next, standing still or running about,
    // and it never needs the edge clamp. The old keyframed flight lurched by up to 2.9 tiles per tick in a frame.
    const flightJumps = keys => {
      const pAt = ct => {
        if (ct <= keys[0][0]) return [keys[0][1], keys[0][2]];
        for (let i = 0; i + 1 < keys.length; i++) {
          const [t0, x0, y0] = keys[i], [t1, x1, y1] = keys[i + 1];
          if (ct <= t1) { const w = (ct - t0) / (t1 - t0); return [x0 + (x1 - x0) * w, y0 + (y1 - y0) * w]; }
        }
        const l = keys[keys.length - 1]; return [l[1], l[2]];
      };
      const fr = 1000 / 60, dct = fr / 600, rocks = [{ id: 1, thrown: 0, color: 'mage' }, { id: 2, thrown: 3, color: 'mage' }];
      const last = {}, speed = {};
      let jump = 0, edge = 0;
      D.cam.init = false;
      for (let ct = -0.5; ct < 10; ct += dct) {
        const pp = pAt(ct);
        D.updateCam(pp, fr);
        D.G.rocks = rocks.filter(k => ct >= k.thrown && ct < k.thrown + 7);
        for (const k of D.G.rocks) {
          const st = D.rockState(k, ct, pp, fr), sc = D.rockScreen(st);
          if (Math.hypot(D.sx(st.x) - sc.X, D.sy(st.y) - st.h * V.TS - sc.Y) > 0.5) edge++;
          const p = [sc.X / V.TS, sc.Y / V.TS];
          if (last[k.id]) {
            const v = Math.hypot(p[0] - last[k.id][0], p[1] - last[k.id][1]) / dct;
            if (speed[k.id] !== undefined) jump = Math.max(jump, Math.abs(v - speed[k.id]));
            speed[k.id] = v;
          }
          last[k.id] = p;
        }
      }
      D.G.rocks = [];
      return [jump, edge];
    };
    let calmJump = 0, calmEdge = 0;
    for (const [x, y] of [[17, 6], [12, 6], [12, 9], [6, 12], [18, 12], [12, 17], [9, 16], [4, 4]]) {
      const [j, e] = flightJumps([[0, x, y]]);
      calmJump = Math.max(calmJump, j); calmEdge += e;
    }
    ok(calmJump < 0.05 && calmEdge === 0, 'S standing still the flight is smooth: its speed changes at most ' + calmJump.toFixed(3) + ' tiles per tick between frames, edge clamp on ' + calmEdge + ' frames');
    const [runJump, runEdge] = flightJumps([[0, 17, 6], [1, 17, 6], [3, 21, 6], [5, 21, 6], [6, 19, 6], [7.2, 19, 6], [8, 19, 8], [10.2, 19, 8]]);
    const [walkJump, walkEdge] = flightJumps([[0, 17, 6], [1, 17, 6], [9, 17, 14]]);
    ok(Math.max(runJump, walkJump) < 0.15 && runEdge + walkEdge === 0, 'S running about and walking south past Doom the rocks follow smoothly: at most ' + Math.max(runJump, walkJump).toFixed(3) + ' tiles per tick between frames, edge clamp on ' + (runEdge + walkEdge) + ' frames');
    snap(17, 6);

    // H: barrage launches from around you, one per tick, each from a different side
    D.S = Object.assign({}, D.S, { color: 'mage', std: false });
    D.newGame(true);
    run(16);
    ok(r() === 10, 'H at T+10');
    const bar = D.G.projs.filter(p => p.kind === 'rock');
    ok(bar.filter(p => p.from).length === 2, 'H two projectiles launched on burst 2');
    const P0 = D.G.player;
    ok(bar.filter(p => p.from).every(p => Math.hypot(p.from[0] - P0.x - 0.5, p.from[1] - P0.y - 0.5) <= 2.9), 'H launch points are within 3 tiles of you');
    run(1);
    ok(bar.filter(p => p.from).length === 3, 'H the third launches on T+11');
    let sides = 0;
    for (let i = 1; i < 6; i++) { let dA = Math.abs(bar[i].ang - bar[i - 1].ang) % (2 * Math.PI); if (dA > Math.PI) dA = 2 * Math.PI - dA; if (dA > Math.PI / 2) sides++; }
    ok(sides === 5, 'H consecutive projectiles come from different sides');
    run(5);
    ok(D.G.rep === null && D.G.fx.some(e => e.kind === 'impact'), 'H impacts drawn as hits land');

    // I: saved settings from the earlier versions carry over
    const m = D.migrate({ zoom: 14, camera: 'follow', layout: 'full', tickMs: 1200, debris: 26, keys: true, mode: 'drill', std: true, ui: '2' });
    ok(m.zoom === 12 && m.camera === 'frame' && m.v === 8, 'I v2 settings move to the closer zoom and the camera that keeps Doom in view');
    ok(!('memes' in D.migrate({ v: 5, memes: true })), 'I the death memes setting is dropped');
    ok(m.ui === '1.25' && !('std' in m), 'I interface scale caps at 125% and the autos setting is dropped');
    ok(m.pray.mage === 16 && m.pray.range === 17 && m.pray.melee === 18 && !('drill' in m), 'I the full book keeps protects on row 4, and the old drill mode is dropped');
    const m6 = D.migrate({ v: 6, drill: true });
    ok(!('drill' in m6) && m6.v === 8, 'I the Rockblock drill setting is dropped');
    ok(m.mode === 'dodge' && m6.mode === 'dodge' && D.migrate({ v: 7, mode: 'punish' }).mode === 'punish', 'I the mode defaults to Double rock, and a saved Rockblock + punish is kept');
    ok(!('tickMs' in m) && !('debris' in m) && !('keys' in m) && !('layout' in m), 'I removed options are dropped');
    const custom = Array(30).fill(null); custom[7] = 'protect_magic'; custom[12] = 'protect_missiles'; custom[0] = 'protect_melee';
    const mc = D.migrate({ v: 3, zoom: 14, camera: 'follow', layout: 'custom', custom });
    ok(mc.camera === 'follow' && mc.zoom === 14 && mc.pray.mage === 7 && mc.pray.range === 12 && mc.pray.melee === 0, 'I a v3 custom book keeps its protect slots and its camera');
    ok(D.migrate({ v: 3, layout: 'lrs' }).pray.mage === 1, 'I the filtered book keeps protects on row 1');

    // J: the prayer book holds only the protection prayers, and they can be moved anywhere
    D.S = Object.assign({}, D.S, { pray: { mage: 1, range: 2, melee: 3 } });
    ok([0, 1, 2, 3, 4, 16].map(D.prayerAt).join() === ',mage,range,melee,,', 'J only the three protection prayers are in the book');
    D.movePrayer('mage', 22);
    ok(D.S.pray.mage === 22 && D.prayerAt(1) === null, 'J a prayer moves to an empty slot');
    D.movePrayer('melee', 2);
    ok(D.S.pray.melee === 2 && D.S.pray.range === 3, 'J dropping on another prayer swaps the two');
    D.S = Object.assign({}, D.S, { pray: { mage: 1, range: 2, melee: 3 } });

    // K: the old Rockblock drill toggle is gone, and the top row has the mode switch instead
    ok(!document.getElementById('btn-drill') && !('drill' in D.S) && !D.setupDrill, 'K no Rockblock drill toggle or setting');
    ok(document.querySelectorAll('.bar .divider').length === 2 && [...document.querySelectorAll('.bar .btn.mode')].map(b => b.textContent).join() === 'Double rock,Rockblock + punish', 'K the top row has the mode switch');

    // L: you always run: no run orb and no run key; a click runs 2 tiles a tick, Ctrl + click walks 1
    D.newGame(true);
    D.layout();
    ok(!D.inOrb && !D.orbGeom && !D.A.icons['Run orb on'] && !D.inSpec(D.specGeom().x, D.specGeom().y), 'L no run orb, and no spec orb outside Rockblock + punish');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'r' }));
    ok(D.G.inputs.length === 0 && D.G.player.run, 'L the R key does nothing and you keep running');
    const lx = D.G.player.x;
    D.queueInput({ type: 'move', x: lx + 4, y: D.G.player.y }); run(1);
    ok(D.G.player.x === lx + 2, 'L a click runs 2 tiles a tick');
    D.queueInput({ type: 'move', x: lx, y: D.G.player.y, walk: true }); run(1);
    ok(D.G.player.x === lx + 1, 'L Ctrl + click walks 1 tile a tick');
    const ovKeys = [...document.querySelectorAll('#ov-keys dt')].map(d => d.textContent).join();
    ok(ovKeys === 'Run,Walk,Attack Doom,Special attack,Pause,Next tick' && getComputedStyle(document.querySelector('#ov-keys .is-punish')).display === 'none', 'L the start window lists Run and Walk, no Pray or Toggle run, and hides the punish rows in Double rock: ' + ovKeys);

    // O: the page itself: removed sections and options, green values in the report, damage table
    const txt = document.querySelector('.app').textContent;
    ok(!txt.includes('Why the tick decides it') && !txt.includes('How this sim was built') && !txt.includes('six projectiles in six'), 'O removed sections and header text are gone');
    ok(!document.getElementById('set-std') && [...document.querySelectorAll('#set-ui option')].map(x => x.value).join() === 'auto,1,1.25', 'O no autos option, interface scale stops at 125%');
    ok(!document.querySelector('.rep-sub'), 'O report has no rock colour subline');
    const okB = document.querySelector('#report .rep-list li.ok b');
    ok(!!okB && getComputedStyle(okB).color === 'rgb(95, 227, 95)', 'O successful lines show their value in green');
    ok(document.querySelector('.bar #btn-edit') && document.querySelector('.bar #btn-reset-layout').hidden, 'O prayer layout buttons live in the top row, reset only while arranging');
    const st = D.ST, per = v => st.reps ? (v ? (v / st.reps).toFixed(1) : '0') : '–';
    const allD = st.dmg.debris + st.dmg.boulder + st.dmg.barrage + st.dmg.beam;
    ok(document.getElementById('st-a-all').textContent === per(allD) && document.getElementById('st-d-all').textContent === String(allD), 'O damage table totals and per-rep averages (' + allD + ' over ' + st.reps + ' reps)');
    ok(document.querySelectorAll('table.dmg td .hs').length === 10, 'P every damage cell in the session table is a hitsplat');
    const allN = st.hitBy.debris + st.hitBy.boulder + st.hitBy.barrage + st.hitBy.beam;
    ok([...document.querySelectorAll('table.dmg thead th')].map(th => th.textContent).join() === 'Damage taken,Times hit,Total,Per rep' && document.getElementById('st-n-all').textContent === String(allN), 'T the damage table has a Times hit column, ' + allN + ' hits in all');
    ok(!txt.includes('How the double rock works') && !txt.includes('The method') && txt.includes('Unofficial fan practice tool'), 'O the notes are gone and the Jagex credit stays');

    // U: the game's own sound effects: every synth renders like the reference renderer, and each plays on the game's tick
    const uIds = Object.keys(D.A.synths);
    const uSum = s => s.reduce((a, v) => (Math.imul(a, 31) + v) | 0, 7);
    const uRender = id => D.synth.render(Uint8Array.from(atob(D.A.synths[id]), c => c.charCodeAt(0)));
    ok(uIds.length === 24 && uIds.every(id => uRender(id).length > 0), 'U all ' + uIds.length + ' fight sounds render');
    const uRef = { 2675: [33075, -957099799], 10331: [33075, -706118489], 10371: [116865, 870910574], 7023: [17640, -1632619715] };
    ok(Object.entries(uRef).every(([id, [n, c]]) => { const s = uRender(id); return s.length === n && uSum(s) === c; }), 'U renders match the reference renders sample for sample');
    D.S = Object.assign({}, D.S, { sound: true, death: false, color: 'mage' });
    D.newGame(true);
    D.soundLog.length = 0;
    const uT = D.G.nextRepTick, uHits0 = D.ST.hitBy.debris + D.ST.hitBy.boulder + D.ST.hitBy.barrage;
    run(uT + 17);
    const uAt = (tick, id) => D.soundLog.filter(e => e.tick === tick && e.id === id);
    const uThrowAt = tick => D.THROW_SOUNDS.every(([id, d]) => uAt(tick, id).some(e => e.delay === d));
    ok(D.WINDUP === 2 && uThrowAt(uT - 2) && uThrowAt(uT + 1) && D.soundLog.filter(e => e.id === D.THROW_SOUNDS[0][0]).length === 2, 'U the throw animation sounds start two ticks before each lift, T-2 and T+1');
    ok(uAt(uT + 7, D.SND.burst).length === 1 && uAt(uT + 10, D.SND.burst).length === 1 && D.soundLog.filter(e => e.id === D.SND.burst).length === 2, 'U an explosion on each burst, T+7 and T+10');
    ok(uAt(uT + 9, D.SND.land).length === 1 && uAt(uT + 12, D.SND.land).length === 1 && D.soundLog.filter(e => e.id === D.SND.land).every(e => e.delay === 0.2), 'U an impact 0.2 s after each landing, T+9 and T+12');
    const uBar = [11, 12, 13, 14, 15, 16].map(k => D.soundLog.filter(e => e.tick === uT + k && (e.id === D.SND.impact.mage || e.id === D.SND.impact.range)).map(e => e.id).join('/')).join();
    ok(uBar === '7023,7026,7023,7023,7026,7023', 'U barrage impacts follow M R M M R M: ' + uBar);
    const uHits1 = D.ST.hitBy.debris + D.ST.hitBy.boulder + D.ST.hitBy.barrage;
    ok(D.soundLog.filter(e => D.SND.hurt.includes(e.id)).length === uHits1 - uHits0 && uHits1 > uHits0, 'U a hit sound for each of the ' + (uHits1 - uHits0) + ' times you were hit');
    D.soundLog.length = 0;
    const uTick0 = D.G.tick, uPray = [2675, 2676, 2677, 2663];
    D.queueInput({ type: 'pray', style: 'mage' }); run(1);
    D.queueInput({ type: 'pray', style: 'range' }); run(1);
    D.queueInput({ type: 'pray', style: 'range' }); run(1);
    const uPrays = D.soundLog.filter(e => uPray.includes(e.id)).map(e => (e.tick - uTick0) + ':' + e.id).join();
    ok(uPrays === '1:2675,2:2677,3:2663', 'U prayers sound on the tick they switch: on, switch, off (' + uPrays + ')');
    D.S = Object.assign({}, D.S, { sound: false });
    D.soundLog.length = 0;
    run(20);
    ok(D.soundLog.length === 0, 'U no sounds with Sound effects off');
    D.S = Object.assign({}, D.S, { sound: true });

    // R: Rockblock + punish. Every rep starts on tile 1; on dip 1 you click tile 2, on dip 2 you arm the special and
    // click Doom, and the halberd's Sweep punishes the melee charge before the beam fires on T+16
    D.S = Object.assign({}, D.S, { color: 'mage', death: false, sound: true });
    D.G.started = false;
    D.setMode('punish');
    const qWin = document.querySelector('#overlay .window');
    ok(!document.getElementById('overlay').hidden && qWin.classList.contains('punish') && document.getElementById('ov-title').textContent === 'Double rockblock + punish' && getComputedStyle(document.querySelector('#ov-keys .is-punish')).display !== 'none', 'R the start window switches to Rockblock + punish, with the attack and special rows');
    D.newGame(true);
    document.getElementById('overlay').hidden = true;
    D.G.running = false;
    const qRB = D.RB, qP = () => D.G.player;
    ok(D.S.mode === 'punish' && qP().x === qRB.t1.x && qP().y === qRB.t1.y, 'R the run starts on tile 1');
    const qMeta = D.A.meta.playerHalberd;
    ok(D.playerSprite() === 'playerHalberd' && !!D.A.playerHalberd && qMeta.length === 4 && qMeta[3] > 1.4 && qMeta[2] > 0.4 && qMeta[2] < 0.65, 'R you hold the crystal halberd, a taller render at the twisted bow render\'s scale: ' + qMeta.join(', '));
    ok(document.getElementById('mode-punish').getAttribute('aria-pressed') === 'true' && document.getElementById('ruler').textContent.includes('click tile 2') && document.getElementById('ruler').textContent.includes('beam fires'), 'R the mode button and the tick ruler switch to the punish steps');
    D.layout();
    const qOrb = D.specGeom();
    ok(D.inSpec(qOrb.x, qOrb.y) && qOrb.y < D.V.ch * 0.15 && qOrb.x > D.V.px, 'R the spec orb sits at the top right');
    ok(parseFloat(getComputedStyle(document.querySelector('.view')).getPropertyValue('--hud-top')) >= qOrb.y + qOrb.r, 'R the pause card sits under the spec orb');
    D.queueInput({ type: 'spec' });
    ok(!qP().spec, 'R the special does not arm before the tick');
    run(1); ok(qP().spec, 'R the special arms on the next tick');
    D.queueInput({ type: 'spec' }); run(1); ok(!qP().spec, 'R a second press disarms it');
    qP().energy = 20;
    D.queueInput({ type: 'spec' }); run(1);
    ok(!qP().spec && document.getElementById('log').firstElementChild.textContent.includes('not have enough special attack energy'), 'R under 30% energy the special will not arm');
    ok(D.doomDist(16, 8) === 2 && D.inReach(16, 8) && D.inReach(15, 9) && !D.inReach(17, 8) && !D.inReach(12, 12), 'R the halberd reaches 2 tiles from Doom');
    // Doom's hull: drawn in this mode, and a click anywhere in it attacks, horns included
    D.render(performance.now());
    const qHull = D.doomHullNow(), qCx = qHull ? qHull.reduce((a, p) => a + p[0], 0) / qHull.length : 0, qCy = qHull ? qHull.reduce((a, p) => a + p[1], 0) / qHull.length : 0;
    const qLeft = qHull ? qHull.reduce((a, p) => (p[0] < a[0] ? p : a)) : [0, 0];
    const qHorn = [qLeft[0] + (qCx - qLeft[0]) * 0.08, qLeft[1] + (qCy - qLeft[1]) * 0.08];
    const qHornTile = D.worldTile(qHorn[0], qHorn[1]);
    ok(!!D.doomHull() && D.doomHull().length >= 6 && D.onDoom(qCx, qCy) && D.onDoom(qHorn[0], qHorn[1]) && !(qHornTile[0] >= 10 && qHornTile[0] < 15 && qHornTile[1] >= 10 && qHornTile[1] < 15) && !D.onDoom(D.sx(20.5), D.sy(6.5)), 'R Doom\'s hull (' + (D.doomHull() || []).length + ' points) is its click area, horns past its tiles included');
    const qBar = D.chargeBarGeom();
    ok(qBar.w >= 2.5 * D.V.TS && qBar.h >= 0.2 * D.V.TS && qBar.s >= 30 * D.V.ui, 'R the charge bar is drawn big: ' + qBar.w + ' by ' + qBar.h + ' px, about ' + (qBar.w / D.V.TS).toFixed(1) + ' tiles wide');

    D.newGame(true);
    D.soundLog.length = 0;
    run(6);
    const qRep = D.G.rep;
    ok(qRep && r() === 0 && qRep.charge && !qRep.charge.on && qP().x === qRB.t1.x && qP().y === qRB.t1.y && qP().energy === 100, 'R rep 1 starts on tile 1 with a full special bar');
    run(3); ok(r() === 3 && qRep.charge.on, 'R Doom starts charging with throw 2 on T+3');
    run(3); ok(r() === 6, 'R at T+6 (dip 1)');
    D.queueInput({ type: 'move', x: qRB.t2.x, y: qRB.t2.y });
    run(3);
    ok(r() === 9 && qRep.b1.x === qRB.t1.x && qRep.b1.y === qRB.t1.y && qP().x === qRB.t2.x && qP().y === qRB.t2.y, 'R boulder 1 is set on tile 1 and you reach tile 2 on T+9');
    D.queueInput({ type: 'spec' }); D.queueInput({ type: 'attack' });
    run(1);
    ok(r() === 10 && qRep.b2.x === qRB.t2.x && qRep.b2.y === qRB.t2.y && qP().target === 'doom' && qP().spec, 'R boulder 2 is set on tile 2 and you head for Doom with the special armed');
    ok(qP().dest && D.doomDist(qP().dest.x, qP().dest.y) === 2, 'R you path to the halberd\'s full reach, 2 tiles from Doom');
    D.queueInput({ type: 'pray', style: qRep.pattern[0] });
    for (let i = 0; i < 6; i++) {
      run(1);
      const nxt = D.G.rep && D.G.rep.pattern[i + 1];
      if (nxt && nxt !== qP().prayer) D.queueInput({ type: 'pray', style: nxt });
    }
    const qPun = qRep.charge.punish;
    ok(D.G.rep === null && qPun && qPun.sweep && qPun.r === 12 && qPun.hits.length === 2 && qPun.hits.every(h => h >= D.HAL.bonus), 'R Sweep punishes the charge on T+12 with two hits: ' + (qPun ? qPun.hits.join(', ') : 'none'));
    ok(!qRep.charge.on && !qRep.charge.fired && !qRep.dmg.beam && qP().energy === 70, 'R the punish cancels the beam and spends 30% energy');
    ok(qRep.hits.every(h => h && h.ok), 'R all six barrage hits prayed on the way');
    const qAt = (tick, id) => D.soundLog.filter(e => e.tick === qRep.start + tick && e.id === id);
    ok(D.SND.charge.every(([id, d]) => qAt(3, id).some(e => e.delay === d)), 'R the charge sounds play on T+3');
    const qLoops = D.soundLog.filter(e => e.id === D.SND.chargeLoop).map(e => e.tick - qRep.start).join();
    ok(qLoops === '4,5,6,7,8,9,10,11', 'R the charge loop sounds every tick until the punish: ' + qLoops);
    ok(qAt(12, D.SND.cancel).length === 1 && !D.soundLog.some(e => D.SND.beam.some(([id]) => id === e.id)), 'R the cancel sound plays on the punish, and no beam');
    const qTxt = document.getElementById('report').textContent;
    ok(qTxt.includes('on tile 1') && qTxt.includes('on tile 2') && qTxt.includes('Sweep on T+12'), 'R the report shows both boulders on their tiles and the Sweep');

    run(3);
    ok(!D.G.rep && qP().x === qRB.t1.x && qP().y === qRB.t1.y && qP().energy === 100 && !qP().target && D.G.boulders.size === 0, 'R three ticks after the rep you are back on tile 1 with a full bar and a clear floor');
    let qW = 0;
    while (!D.G.rep && qW++ < 20) run(1);
    const qRep2 = D.G.rep, qBeam0 = D.ST.hitBy.beam;
    ok(qRep2 && qP().x === qRB.t1.x && qP().y === qRB.t1.y && D.soundLog.filter(e => e.tick === qRep2.start - 2 && e.id === D.THROW_SOUNDS[0][0]).length === 1, 'R the next rep starts with you on tile 1, after the throw animation');
    D.soundLog.length = 0;
    run(16);
    ok(qRep2.charge.fired && qRep2.dmg.beam === 99 && D.ST.hitBy.beam === qBeam0 + 1 && qRep2.wouldDie, 'R left alone, the charge fires the beam on T+16 for 99');
    ok(D.SND.beam.every(([id, d]) => D.soundLog.some(e => e.tick === qRep2.start + 16 && e.id === id && e.delay === d)), 'R the beam sounds play on T+16');
    ok(document.getElementById('report').textContent.includes('missed, beam hit you'), 'R the report says the punish was missed');

    D.setMode('dodge');
    D.G.running = false;
    ok(qP().x === 17 && qP().y === 6 && !D.inSpec(qOrb.x, qOrb.y) && D.playerSprite() === 'player' && !D.onDoom(qCx, qCy), 'R back in Double rock: your old start tile, the twisted bow, no spec orb, and Doom is not a target');
    run(6);
    ok(D.G.rep && D.G.rep.charge === null, 'R Double rock reps have no charge');

    // V: sound on or off and the volume, on the control row under the game view
    const vBox = document.getElementById('bar-sound'), vSet = document.getElementById('set-sound'), vVol = document.getElementById('set-volume'), vOut = document.getElementById('set-volume-out');
    ok(!!vBox && !!vVol && vBox.closest('.bar') && vVol.closest('.bar') && vOut.textContent === D.S.volume + '%', 'V the control row has a Sound checkbox and a volume slider: ' + vOut.textContent);
    D.S = Object.assign({}, D.S, { sound: true, volume: 50 });
    D.audio();
    vVol.value = '20'; vVol.dispatchEvent(new Event('input'));
    ok(D.S.volume === 20 && vOut.textContent === '20%' && (D.outGain() === null || D.outGain() === undefined || Math.abs(D.outGain() - 0.2) < 1e-6), 'V the slider sets the volume as you drag (output gain ' + D.outGain() + ')');
    vVol.value = '50'; vVol.dispatchEvent(new Event('input')); vVol.dispatchEvent(new Event('change'));
    ok(D.S.volume === 50 && D.soundLog[D.soundLog.length - 1].id === D.SND.pray.mage, 'V letting go plays a short game sound at the new level');
    vBox.checked = false; vBox.dispatchEvent(new Event('change'));
    ok(!D.S.sound && !vSet.checked && document.querySelector('.sound-ctl').classList.contains('off'), 'V unticking Sound turns the sound effects off, here and in Settings');
    vSet.checked = true; vSet.dispatchEvent(new Event('change'));
    ok(D.S.sound && vBox.checked && !document.querySelector('.sound-ctl').classList.contains('off'), 'V ticking Sound effects in Settings turns them back on, here too');

    // M: dying in Real hitpoints: the rep counts, the report says Dead, and the death window offers a fresh run
    D.S = Object.assign({}, D.S, { death: true, color: 'mage' });
    D.newGame(true);
    run(6 + 8);
    D.G.player.hp = 5;
    const repsBefore = D.ST.reps;
    D.soundLog.length = 0;
    run(1);
    ok(D.G.dead, 'M boulder 1 kills you');
    ok(D.soundLog.some(e => e.id === D.SND.death), 'M the death sound plays');
    ok(D.ST.reps === repsBefore + 1 && document.querySelector('#report .pill').textContent === 'Dead', 'M the fatal rep is counted and marked Dead');
    const ov = document.getElementById('overlay');
    ok(!ov.hidden && document.getElementById('ov-title').textContent === 'Oh dear, you are dead!' && document.getElementById('ov-go').textContent === 'Try again' && document.getElementById('ov-keys').hidden, 'M the death window shows, with Try again');
    ok(!document.getElementById('meme') && !document.getElementById('set-memes') && !('memes' in D.S), 'M the death memes are gone');
    document.getElementById('ov-go').click();
    ok(ov.hidden && !D.G.dead && D.G.started, 'M Try again starts a fresh run');
  } catch (e) {
    out.push('EXCEPTION ' + e.message + '\n' + e.stack);
  }
  document.getElementById('test-out').textContent = out.concat(window.__errs).join('\n') + '\nDONE';
}, 100));
</script>
